openapi: 3.0.3

info:
  title: h26_07 API
  version: 0.1.0
  description: |
    通常数字球だけを扱う Web ビンゴアプリの HTTP API と WebSocket イベント本文のスキーマ。
    ゲームルールの意味論は docs/domain.md、通信境界の設計は docs/api.md を正本とする。

servers:
  - url: http://localhost:8080
    description: 開発環境

security:
  - forwardedUser: []

tags:
  - name: users
    description: 認証ユーザー
  - name: rooms
    description: ルーム
  - name: participants
    description: 参加者
  - name: chats
    description: チャット
  - name: controls
    description: 管理者向け操作
  - name: settings
    description: ゲーム設定
  - name: websocket
    description: WebSocket 接続

paths:
  /api/me:
    get:
      tags:
        - users
      summary: 自分のユーザー情報を取得
      operationId: getMe
      responses:
        "200":
          description: 認証中のユーザー。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms:
    get:
      tags:
        - rooms
      summary: ルーム一覧を取得
      description: 終了済みのルームを含む全ルームを返す。
      operationId: listRooms
      responses:
        "200":
          description: 終了済みのルームを含む一覧。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - rooms
      summary: ルームを作成
      description: 認証済みユーザーがルームを作成する。作成者はそのルームの管理者になる。
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "200":
          description: 作成されたルーム。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}:
    get:
      tags:
        - rooms
      summary: ルーム詳細を取得
      description: 参加者または管理者は終了済みのルームも取得できる。
      operationId: getRoom
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: ルーム詳細。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: このルームを閲覧する権限がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/participants:
    post:
      tags:
        - participants
      summary: ルームに参加
      description: 待機中のルームに参加する。既に参加済みのユーザーはルームの状態にかかわらず冪等に成功し、参加者を重複して登録しない。
      operationId: joinRoom
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 参加成功。既に参加済みの場合も成功扱い。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: このルームへの参加が許可されていない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: ルームが待機中ではないため参加できない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/chats:
    get:
      tags:
        - chats
      summary: チャット履歴を取得
      description: 参加者または管理者が閲覧できる。
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: チャット履歴。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          description: ルーム ID の形式が不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: このルームのチャットを閲覧する権限がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - chats
      summary: チャットを投稿
      description: 参加者または管理者は待機中または進行中に投稿できる。終了後は投稿できない。
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "200":
          description: 作成されたチャットメッセージ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: メッセージ本文が空、または長すぎるなど、リクエスト本文が不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: このルームにチャット投稿する権限がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: ルームが終了済みなど、投稿できない状態。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/start:
    post:
      tags:
        - controls
      summary: ゲームを開始
      description: 開始時点の参加者全員にカードを一括生成する。既に進行中の場合は変更せず成功する。
      operationId: startGame
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: ゲーム開始成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: ルームが終了済み、または参加者がいないため開始できない状態。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/finish:
    post:
      tags:
        - controls
      summary: ゲームを終了
      description: 管理者がゲームを終了し、ルームを終了済みにする。既に終了済みの場合は変更せず成功する。抽選中に終了する場合は未確定の結果を破棄し、WebSocket では PickCanceled の後に GameFinished を送る。
      operationId: finishGame
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: ゲーム終了成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: ルームが待機中。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/pick/start:
    post:
      tags:
        - controls
      summary: 抽選を開始
      description: 抽選中の状態にする。結果はまだ決めない。既に抽選中の場合も成功し、PickStarted を再送する。抽選可能な球がない場合は成功しない。
      operationId: startPick
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 抽選開始成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: ゲームが進行中ではない、または抽選可能な球がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/pick/cancel:
    post:
      tags:
        - controls
      summary: 抽選をキャンセル
      description: 抽選中の状態をキャンセルする。ゲーム状態と球履歴は変えない。既に待機中の場合は変更せず成功する。
      operationId: cancelPick
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 抽選キャンセル成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: 抽選状態またはゲーム状態が不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/pick/finish:
    post:
      tags:
        - controls
      summary: 抽選結果を確定
      description: サーバーが球を1つ決め、カード差分、球履歴、ビンゴ/リーチ通知イベントを原子的に更新する。
      operationId: finishPick
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 抽選確定成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: 現在抽選中ではない、またはゲーム状態が不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/qrcode/show:
    post:
      tags:
        - controls
      summary: QR コードを表示
      description: 表示画面で QR コードを表示する。
      operationId: showQRCode
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: QR コード表示成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/control/qrcode/hide:
    post:
      tags:
        - controls
      summary: QR コードを非表示
      description: 表示画面で QR コードを非表示にする。
      operationId: hideQRCode
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: QR コード非表示成功。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/settings:
    put:
      tags:
        - settings
      summary: ゲーム設定を更新
      description: 待機中または進行中に更新できる。管理者の追加・削除もこのエンドポイントで行う。
      operationId: updateGameSettings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameSettingsRequest"
      responses:
        "200":
          description: 更新後のゲーム設定。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: ルームが終了済みのため設定変更できない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/rooms/{roomId}/ws:
    get:
      tags:
        - websocket
      summary: WebSocket 接続を開始
      operationId: connectRoomWebSocket
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: mode
          in: query
          required: true
          description: 参加者用または表示用のいずれか。カードが必要な参加者は参加者用モード、カードを受け取らない表示・運営画面は表示用モードで接続する。
          schema:
            $ref: "#/components/schemas/WebSocketMode"
      responses:
        "101":
          description: WebSocket 通信。

components:
  securitySchemes:
    forwardedUser:
      type: apiKey
      in: header
      name: X-Forwarded-User
      description: 認証済みユーザーの traP ユーザー ID。

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: ルーム ID。
      schema:
        $ref: "#/components/schemas/RoomId"

  responses:
    BadRequest:
      description: リクエスト本文が不正。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認証されていない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminRequired:
      description: 管理者ではない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoomNotFound:
      description: 指定したルームが存在しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: サーバ内部エラー。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    DateTime:
      type: string
      format: date-time
      description: ISO 8601 形式の日時文字列。

    UserId:
      type: string
      minLength: 1
      description: traP のユーザー ID。

    RoomId:
      type: string
      format: uuid
      description: ルーム ID。

    RoomCode:
      type: string
      pattern: "^\\d{6}$"
      description: 6 桁の数字文字列。
      example: "123456"

    RoomState:
      type: string
      enum:
        - waiting
        - playing
        - finished

    PickState:
      type: string
      enum:
        - idle
        - picking
        - exhausted

    WebSocketMode:
      type: string
      enum:
        - participant
        - display

    WebSocketEventType:
      type: string
      enum:
        - ParticipantJoined
        - Initialized
        - GameStarted
        - PickStarted
        - PickCanceled
        - PickFinished
        - GameFinished
        - ShowQRCode
        - HideQRCode
        - MessageCreated
        - AllPicked
        - GameSettingsUpdated

    CardCellState:
      type: string
      enum:
        - bingo
        - reach
        - open
        - closed

    Error:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
        - message

    User:
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
      required:
        - userId

    GameSettingsInput:
      type: object
      additionalProperties: false
      description: 作成・更新時に渡すゲーム設定。adminUserIds を指定した場合は管理者一覧を置き換える。
      properties:
        name:
          type: string
        description:
          type: string
        adminUserIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UserId"
      required:
        - name
        - description

    GameSettings:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        admins:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/User"
      required:
        - name
        - description
        - admins

    ParticipantSummary:
      type: object
      additionalProperties: false
      description: 参加者一覧や表示画面向けの概要。管理者権限、カード詳細、リーチ情報、ビンゴ情報は含めない。
      properties:
        user:
          $ref: "#/components/schemas/User"
        joinedAt:
          $ref: "#/components/schemas/DateTime"
      required:
        - user
        - joinedAt

    Room:
      type: object
      additionalProperties: false
      properties:
        roomId:
          $ref: "#/components/schemas/RoomId"
        roomCode:
          $ref: "#/components/schemas/RoomCode"
        state:
          $ref: "#/components/schemas/RoomState"
        pickState:
          $ref: "#/components/schemas/PickState"
        qrCodeVisible:
          type: boolean
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantSummary"
        bingoSummaries:
          type: array
          items:
            $ref: "#/components/schemas/BingoSummary"
        reachSummaries:
          type: array
          items:
            $ref: "#/components/schemas/ReachSummary"
        settings:
          $ref: "#/components/schemas/GameSettings"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      required:
        - roomId
        - roomCode
        - state
        - pickState
        - qrCodeVisible
        - participants
        - bingoSummaries
        - reachSummaries
        - settings
        - createdAt
        - updatedAt

    Card:
      type: object
      additionalProperties: false
      description: 参加者にだけ送るカードの状態一式。
      properties:
        cardId:
          type: string
          format: uuid
        cardNumber:
          type: string
          description: カード生成時に定める 36 桁数字文字列。生成後は変更しない。
          minLength: 36
          maxLength: 36
          pattern: "^[0-9]{36}$"
        ownerUserId:
          $ref: "#/components/schemas/UserId"
        cells:
          type: array
          minItems: 25
          maxItems: 25
          items:
            $ref: "#/components/schemas/CardCell"
        bingoLines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
        reachLines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
      required:
        - cardId
        - cardNumber
        - ownerUserId
        - cells
        - bingoLines
        - reachLines

    CardCell:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 24
        number:
          type: integer
          minimum: 1
          maximum: 75
          nullable: true
          description: 中央のフリー枠は null。
        displayText:
          type: string
        cellState:
          $ref: "#/components/schemas/CardCellState"
      required:
        - index
        - number
        - displayText
        - cellState

    Line:
      type: array
      minItems: 5
      maxItems: 5
      items:
        type: integer
        minimum: 0
        maximum: 24

    Message:
      type: object
      additionalProperties: false
      properties:
        messageId:
          type: string
          format: uuid
        content:
          type: string
        author:
          $ref: "#/components/schemas/User"
        createdAt:
          $ref: "#/components/schemas/DateTime"
      required:
        - messageId
        - content
        - author
        - createdAt

    PickedBall:
      type: integer
      minimum: 1
      maximum: 75
      description: 確定済みの通常数字球。1..75。

    CardChanges:
      type: object
      additionalProperties: false
      description: 参加者向け PickFinished にだけ含める演出用の差分。
      properties:
        openedCellIndices:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 24
        newReachLines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
        newBingoLines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
      required:
        - openedCellIndices
        - newReachLines
        - newBingoLines

    BingoSummary:
      type: object
      additionalProperties: false
      description: 現在ビンゴしている参加者の概要。
      properties:
        user:
          $ref: "#/components/schemas/User"
        bingoOrders:
          type: array
          items:
            type: integer
            minimum: 1
        createdAt:
          $ref: "#/components/schemas/DateTime"
      required:
        - user
        - bingoOrders
        - createdAt

    ReachSummary:
      type: object
      additionalProperties: false
      description: 現在リーチしていて、まだビンゴしていない参加者の概要。
      properties:
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          $ref: "#/components/schemas/DateTime"
      required:
        - user
        - createdAt

    CreateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        settings:
          $ref: "#/components/schemas/GameSettingsInput"
      required:
        - settings

    CreateMessageRequest:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - content

    UpdateGameSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        settings:
          $ref: "#/components/schemas/GameSettingsInput"
      required:
        - settings

    EmptyObject:
      type: object
      additionalProperties: false

    ParticipantInitializedBody:
      type: object
      additionalProperties: false
      properties:
        activityLog:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLogEntry"
        state:
          $ref: "#/components/schemas/RoomState"
        settings:
          $ref: "#/components/schemas/GameSettings"
        pickState:
          $ref: "#/components/schemas/PickState"
        pickedBalls:
          type: array
          items:
